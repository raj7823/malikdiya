<style>
:root{--gold:#ffd76a;--blue:#171cff;--green:#28d17c}
*{box-sizing:border-box}
body{margin:0;background:#030507;color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center;overflow-x:hidden}
.page{position:relative;min-height:100vh;padding:38px 16px 34px;max-width:520px;margin:0 auto;isolation:isolate;display:flex;flex-direction:column;align-items:center;text-align:center}
.pitch{position:fixed;inset:0;z-index:-2;opacity:.16;background:radial-gradient(ellipse at 50% 24%,#164e36 0,transparent 42%),linear-gradient(135deg,transparent 46%,#0d2c20 47%,transparent 49%);pointer-events:none}
.stars{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(#fff9 1px,transparent 1.5px),radial-gradient(#ffd76a88 1px,transparent 1.5px);background-size:53px 61px,79px 87px;background-position:0 0,25px 33px;animation:twinkle 3s ease-in-out infinite alternate}
h1{font-size:clamp(23px,6vw,30px);margin:18px 0 12px;font-weight:900;color:var(--gold);text-shadow:0 0 15px #ffc74466}
.tagline{font-size:16px;line-height:1.5;margin:14px auto 22px;font-weight:700;text-align:center;width:100%}
.sub{font-size:14px;color:#eee;margin:0 auto 20px;text-align:center;width:100%}
.passes{list-style:none;padding:0;margin:0 auto 28px;display:grid;gap:12px;font-size:15px;font-weight:700;width:100%;justify-items:center;text-align:center}
.passes li{animation:fadeUp .7s both}
.passes li:nth-child(2){animation-delay:.12s}
.passes li:nth-child(3){animation-delay:.24s}
.passes li:nth-child(4){animation-delay:.36s}
.passes span{color:var(--gold);text-shadow:0 0 10px #ffd76a66}
.join{display:block;position:relative;overflow:hidden;width:100%;max-width:340px;margin:26px auto 18px;padding:18px 12px;border-radius:13px;text-decoration:none;color:#fff;font-weight:900;font-size:20px;letter-spacing:.2px;background:linear-gradient(110deg,#1515ff,#3730ff,#1010d9);box-shadow:0 0 0 1px #7b7bff88,0 8px 24px #1515ff55;animation:tap 1.15s ease-in-out infinite;align-self:center}
.join:before{content:"";position:absolute;top:-60%;left:-60%;width:38%;height:220%;background:linear-gradient(90deg,transparent,#ffffff85,transparent);transform:rotate(24deg);animation:shine 2.7s linear infinite}
.join:active{transform:scale(.97)}
.join span{position:relative;z-index:1}
.footer{font-size:13px;color:#ddd;margin:18px auto 0;text-align:center;width:100%}
.footer b{color:var(--gold)}
.badge{display:inline-block;border:1px solid #ffd76a66;background:#ffd76a12;color:var(--gold);border-radius:99px;padding:7px 12px;font-size:11px;letter-spacing:1.2px;font-weight:800}
@keyframes tap{0%,100%{transform:scale(1);box-shadow:0 0 0 1px #7777ff,0 8px 24px #1515ff55}50%{transform:scale(1.035);box-shadow:0 0 0 4px #3535ff33,0 10px 30px #2929ff99}}
@keyframes shine{0%{left:-70%}55%,100%{left:140%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes logoGlow{from{filter:drop-shadow(0 0 2px #ffd76a);transform:scale(1)}to{filter:drop-shadow(0 0 12px #ffd76a);transform:scale(1.035)}}
@keyframes twinkle{from{opacity:.09}to{opacity:.24}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:480px){
.page{padding:38px 16px 34px;max-width:520px}
.passes{width:100%;justify-items:center;text-align:center}
}
@media(prefers-reduced-motion:reduce){
*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}
}
.profile-wrap{width:140px;height:140px;margin:8px auto 16px;border:3px solid #ffd76a;border-radius:50%;padding:3px;background:#050505;box-shadow:0 0 9px #ffd76a,0 0 22px #ffb00077;overflow:hidden;animation:float 2.4s ease-in-out infinite}
.profile-photo{display:block;width:100%;height:100%;object-fit:cover;object-position:center 38%;border-radius:50%;animation:logoGlow 2.2s ease-in-out infinite alternate}
</style>
